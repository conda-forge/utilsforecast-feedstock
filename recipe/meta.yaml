{% set name = "utilsforecast" %}
{% set version = "0.2.17" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/utilsforecast-{{ version }}.tar.gz
  sha256: c501e1d60ea28ff9a0bee83f3e3fff9204da63afe590d83577811f4a95665ce8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy
    - packaging
    - pandas >=1.1.1
    - narwhals >=2.0

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - utilsforecast
  commands:
    - pip check

about:
  home: https://github.com/Nixtla/utilsforecast
  summary: Forecasting utilities
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - AzulGarza
    - jmoralez
    - cchallu
    - mergenthaler
    - marcopeix
    - elephaint
    - JQGoh
    - nasaul
    - MMenchero
    - goodwanghan
